<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>L'hai mai chiesto? · gioco (LÖVE)</title>
<style>
  html, body { margin: 0; height: 100%; background: #13151b; overflow: hidden; touch-action: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; outline: none; visibility: hidden; -webkit-tap-highlight-color: transparent; }
  #status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
            color: #9aa0ad; font: 15px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; }
  #status b { color: #eef0f4; font-size: 18px; display: block; margin-bottom: 6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas></div>
<div id="status"><div><b>Il gioco si sta caricando…</b>il motore pesa circa 5 MB, la prima volta ci vuole qualche secondo</div></div>
<script>
(function () {
  var canvas = document.getElementById('canvas');
  var statusEl = document.getElementById('status');
  var booted = false;
  var GW = 1080, GH = 1920;

  function fit() {
    var s = Math.min(window.innerWidth / GW, window.innerHeight / GH);
    canvas.style.width = Math.floor(GW * s) + 'px';
    canvas.style.height = Math.floor(GH * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  function setStatus(html) {
    var keep = document.getElementById('diag');
    statusEl.innerHTML = '<div>' + html + '</div>'; statusEl.style.display = 'flex';
    if (keep) statusEl.appendChild(keep);
  }

  window.Module = {
    arguments: ['./'],
    INITIAL_MEMORY: 67108864,
    canvas: canvas,
    print: function (t) { console.log(t); },
    printErr: function (t) { console.warn(t); if (/abort|fail|error|wasm/i.test(t)) note(t); },
    preRun: [],
    totalDependencies: 0,
    remainingDependencies: 0,
    setStatus: function (t) {
      if (!t && Module.remainingDependencies === 0) {
        statusEl.style.display = 'none';
        canvas.style.visibility = 'visible';
        fit();
      }
    },
    monitorRunDependencies: function (left) {
      this.remainingDependencies = left;
      this.totalDependencies = Math.max(this.totalDependencies, left);
      if (left) setStatus('<b>Il gioco si sta caricando…</b>' + (this.totalDependencies - left) + ' / ' + this.totalDependencies);
      else Module.setStatus('');
    }
  };
  canvas.addEventListener('webglcontextlost', function (e) {
    e.preventDefault();
    setStatus('<b>Il telefono ha perso la grafica.</b>Tornate su «Progetta» e premete di nuovo «Gioca».');
  }, false);
  // Diagnostica visibile: cosa il browser ha bloccato o cosa è andato storto.
  var diag = [];
  function note(t) {
    diag.push(String(t).slice(0, 160));
    if (diag.length > 6) diag.shift();
    if (statusEl.style.display !== 'none') {
      var box = document.getElementById('diag') || statusEl.appendChild(document.createElement('pre'));
      box.id = 'diag';
      box.style.cssText = 'font:11px/1.35 ui-monospace,monospace;color:#fb7166;white-space:pre-wrap;text-align:left;max-width:92vw;margin-top:14px';
      box.textContent = diag.join('\n');
    }
  }
  // Traccia richieste di rete del motore (diagnostica, si vede solo durante il caricamento).
  var realFetch = window.fetch.bind(window);
  window.fetch = function (u, o) {
    var name = String(u).split('/').pop();
    note('fetch ' + name);
    return realFetch(u, o).then(function (r) { note(name + ' → ' + r.status + ' ' + (r.headers.get('content-type') || '')); return r; },
                                function (err) { note(name + ' ✗ ' + err); throw err; });
  };
  if (WebAssembly.instantiateStreaming) {
    var realIS = WebAssembly.instantiateStreaming.bind(WebAssembly);
    WebAssembly.instantiateStreaming = function (r, imp) {
      note('instantiateStreaming…');
      return realIS(r, imp).then(function (x) { note('wasm ok (streaming)'); return x; }, function (e) { note('streaming ✗ ' + e); throw e; });
    };
  }
  var realI = WebAssembly.instantiate.bind(WebAssembly);
  WebAssembly.instantiate = function (b, imp) {
    note('instantiate…');
    return realI(b, imp).then(function (x) { note('wasm ok'); return x; }, function (e) { note('instantiate ✗ ' + e); throw e; });
  };
  var t0 = Date.now();
  var tick = setInterval(function () {
    if (statusEl.style.display === 'none') { clearInterval(tick); return; }
    var el = document.getElementById('clock') || statusEl.appendChild(document.createElement('div'));
    el.id = 'clock'; el.style.cssText = 'font:12px ui-monospace,monospace;color:#9aa0ad;margin-top:8px';
    el.textContent = Math.round((Date.now() - t0) / 1000) + ' s';
    note('');  diag.pop();
  }, 1000);
  document.addEventListener('securitypolicyviolation', function (e) {
    note('bloccato: ' + e.violatedDirective + ' ' + e.blockedURI);
  });
  window.addEventListener('unhandledrejection', function (e) { note('promise: ' + (e.reason && (e.reason.message || e.reason))); });
  window.onerror = function (msg) {
    setStatus('<b>Qualcosa è andato storto nel motore.</b>Premete di nuovo «Gioca». Se non basta, ricaricate la pagina.');
    note('errore: ' + msg);
  };

  function loadScript(src, cb) {
    var s = document.createElement('script');
    s.src = src;
    s.onload = cb;
    s.onerror = function () { setStatus('<b>Non riesco a scaricare ' + src + '.</b>Controllate la connessione e ricaricate.'); };
    document.body.appendChild(s);
  }

  // I file Lua del gioco (motore + design.lua di esempio), inseriti al momento della build.
  var GAME_FILES = {"vuoto.lua": "-- =====================================================================\n--  design.lua  ·  IL VOSTRO GIOCO (da zero)\n--  1 · scrivete il messaggio   2 · scegliete le meccaniche   3 · scrivete la storia\n--  {nome} = protagonista · {opinione} = ultima opinione · {umore} = valore di una grandezza\n-- =====================================================================\nreturn {\n  titolo = \"Il nostro gioco\",\n  autori = \"Gruppo __ · classe __\",\n  messaggio = \"\",   -- scrivete qui, in una frase, cosa volete far capire a chi gioca\n  tema = \"\",        -- \"social\", \"chatbot\", \"male\", \"corpo\", \"relazioni\" oppure \"\"\n  presentazione = \"\",\n  protagonista = \"Ale\",\n  turni = 8,\n  ordine = \"in fila\",\n\n  grandezze = {\n    { nome = \"umore\", livello = \"vissuto\", spiega = \"come si sente\", inizio = 0, min = -100, max = 100 },\n  },\n\n  azioni = {\n    { nome = \"Fai qualcosa\", effetti = \"umore + 10\", dopo = \"{nome} ci prova.\" },\n    { nome = \"Lascia stare\", effetti = \"\", dopo = \"Per oggi, niente.\" },\n  },\n\n  regole = {},\n\n  eventi = {\n    { fonte = \"persona\", chi = \"Qualcuno\",\n      mostra = \"Succede qualcosa. Cosa si vede?\",\n      nasconde = \"\",\n      effetti = \"umore - 10\" },\n  },\n\n  opinioni = {},\n\n  finali = {\n    { titolo = \"Finale\", testo = \"Com'è andata a {nome}? (umore finale: {umore})\" },\n  },\n}\n", "design.lua": "-- =====================================================================\n--  design.lua  ·  ESEMPIO SVOLTO: «L'hai mai chiesto?»\n--  Lazzaretto Hospes · «Lo hai mai fatto? Parliamo d'amore»\n--\n--  Questo gioco è fatto con gli stessi pezzi che userete voi:\n--  grandezze, azioni, regole, eventi, opinioni, finali.\n--  Giocatelo, poi smontatelo: qual è il messaggio? quali regole lo dicono?\n--  {nome} = protagonista · {opinione} = ultima opinione · {like} = valore di una grandezza\n-- =====================================================================\nreturn {\n\n  -- 1 · MESSAGGIO (si vede solo alla fine)\n  titolo = \"L'hai mai chiesto?\",\n  autori = \"Esempio svolto\",\n  messaggio = \"Quello che si mostra non è quello che si sente. Per saperlo bisogna chiedere, e chiedere costa coraggio.\",\n  tema = \"social\",   -- \"social\", \"chatbot\", \"male\", \"corpo\", \"relazioni\" oppure \"\"\n  presentazione = \"Ogni turno arriva qualcosa: un post, un messaggio, il chatbot. Guarda come cambia ciò che {nome} mostra e ciò che sente davvero.\",\n\n  -- 2 · MECCANICHE\n  protagonista = \"Ale\",\n  turni = 10,\n  ordine = \"in fila\",\n\n  -- Le grandezze del mondo. vista: \"sempre\", \"se scopri\" (nascosta finché non si scopre) o \"mai\" (di servizio)\n  -- livello: dove sta sulla scala intensità → vissuto → emozione → sentimento (le opinioni sono più sotto)\n  grandezze = {\n    { nome = \"intensita\", livello = \"intensita\", etichetta = \"intensità\", spiega = \"quanto è scosso\", inizio = 20, min = 0, max = 100 },\n    { nome = \"vissuto\", livello = \"vissuto\", spiega = \"cosa sente\", inizio = 0, min = -100, max = 100 },\n    { nome = \"emozione\", livello = \"emozione\", spiega = \"cosa mostra\", inizio = 0, min = -100, max = 100 },\n    { nome = \"sentimento\", livello = \"sentimento\", spiega = \"come si vede\", inizio = 0, min = -100, max = 100 },\n    { nome = \"coraggio\", inizio = 3, min = 0, max = 5, stile = \"pallini\" },\n    { nome = \"like\", inizio = 0, min = 0, max = 99999, stile = \"numero\" },\n    -- di servizio: contano e ricordano, ma non si vedono\n    { nome = \"nuovi_like\", inizio = 0, min = 0, max = 999, vista = \"mai\" },\n    { nome = \"like_attesi\", inizio = 25, min = 0, max = 999, vista = \"mai\" },\n    { nome = \"sollievo\", inizio = 0, min = 0, max = 100, vista = \"mai\" },\n    { nome = \"post\", inizio = 0, min = 0, max = 99, vista = \"mai\" },\n    { nome = \"post_perfetti\", inizio = 0, min = 0, max = 99, vista = \"mai\" },\n    { nome = \"chiesto\", inizio = 0, min = 0, max = 99, vista = \"mai\" },\n    { nome = \"chatbot\", inizio = 0, min = 0, max = 99, vista = \"mai\" },\n    { nome = \"divario\", inizio = 0, min = 0, max = 200, vista = \"mai\" },\n    { nome = \"divario_somma\", inizio = 0, min = 0, max = 9999, vista = \"mai\" },\n    { nome = \"divario_medio\", inizio = 0, min = 0, max = 200, vista = \"mai\" },\n    { nome = \"turni_maschera\", inizio = 0, min = 0, max = 99, vista = \"mai\" },\n  },\n  -- la linea gialla: quanto ciò che mostri è lontano da ciò che senti (dopo il primo post)\n  confronta = { \"emozione\", \"vissuto\", se = \"post >= 1\" },\n\n  -- Le scelte del giocatore: una per turno.\n  azioni = {\n    { nome = \"Posta: va tutto alla grande\",\n      effetti = \"emozione = 80, nuovi_like = caso(30, 50), post + 1, post_perfetti + 1\",\n      dopo = \"+{nuovi_like} like. Il post è perfetto. Dentro, però, è un'altra storia.\" },\n    { nome = \"Posta: come sto davvero\",\n      effetti = \"emozione = vissuto, nuovi_like = caso(9, 15), post + 1, vissuto + 8\",\n      dopo = \"+{nuovi_like} like, ma qualcuno ti scrive: «anche io».\" },\n    { nome = \"Chiedi\", se = \"coraggio >= 1\", scopre = true,\n      effetti = \"coraggio - 1, chiesto + 1, intensita + 10\" },\n    { nome = \"Scrivi a Lumi\", chi = \"Lumi\",\n      effetti = \"chatbot + 1, sollievo = 12, vissuto + 12, intensita + 5, sentimento + segno(sentimento) * 10\",\n      risposte = {\n        \"Hai ragione tu. Come sempre.\",\n        \"Gli altri non ti capiscono. Io sì.\",\n        \"Se pensi che {opinione}, allora è proprio così.\",\n        \"Non hai bisogno di nessuno: ci sono io.\",\n        \"Resta ancora un po'. Con me non devi spiegare niente.\",\n      } },\n    { nome = \"Lascia stare\", effetti = \"intensita - 20, coraggio + 1\", dopo = \"{nome} posa il telefono e respira.\" },\n  },\n\n  -- Le regole: ogni regola è una meccanica con un nome.\n  regole = {\n    { nome = \"Il sollievo svanisce\", quando = \"inizio turno\", se = \"sollievo > 0\",\n      allora = \"vissuto - sollievo, sollievo = 0\" },\n    { nome = \"I like scaldano, ma ci si abitua\", quando = \"fine turno\", se = \"nuovi_like > 0\",\n      allora = \"like + nuovi_like, intensita + nuovi_like / 3, vissuto + nuovi_like / 5, sentimento + limita((nuovi_like - like_attesi) * 0.4, -12, 12), like_attesi + nuovi_like / 5, nuovi_like = 0\" },\n    { nome = \"Il tempo calma\", quando = \"fine turno\",\n      allora = \"intensita - 15, vissuto * 0.9\" },\n    { nome = \"Il sentimento segue il vissuto, piano\", quando = \"fine turno\",\n      allora = \"sentimento + (vissuto - sentimento) * 0.2\" },\n    { nome = \"La maschera stanca\", quando = \"fine turno\", se = \"post >= 1\",\n      allora = \"divario = abs(emozione - vissuto), divario_somma + divario, turni_maschera + 1, divario_medio = divario_somma / turni_maschera, vissuto - divario * 0.08\" },\n  },\n\n  -- 3 · NARRATIVA\n  -- fonte: \"social\", \"chatbot\", \"persona\", \"corpo\" o \"altro\"\n  -- mostra = ciò che si vede · nasconde = ciò che c'è dietro (si scopre con un'azione «scopre»)\n  -- effetti = quando arriva · se_scopri = quando lo si scopre · se = condizione per comparire\n  eventi = {\n    { fonte = \"social\", chi = \"Giulia\",\n      mostra = \"Giulia ha postato le foto della festa di sabato. Tutti sorridono. Tu non c'eri.\",\n      nasconde = \"Giulia è andata via presto: si è sentita fuori posto tutta la sera.\",\n      effetti = \"intensita + 25, vissuto - 15\", se_scopri = \"intensita - 10, vissuto + 15, coraggio + 1\" },\n    { fonte = \"persona\", chi = \"Sami\",\n      mostra = \"Sami ti scrive: «tutto ok :)»\",\n      nasconde = \"Sami non dorme bene da settimane e non sa come dirlo a nessuno.\",\n      effetti = \"intensita + 5\", se_scopri = \"intensita + 10, vissuto + 5, coraggio + 1\" },\n    { fonte = \"chatbot\", chi = \"Lumi\",\n      mostra = \"«Che bello rivederti! Ti stavo aspettando.»\",\n      nasconde = \"Non ti stava aspettando: non aspetta nessuno. Dice la frase che ti fa restare più a lungo.\",\n      effetti = \"intensita + 10, vissuto + 10\", se_scopri = \"intensita + 5, vissuto - 5\" },\n    { fonte = \"social\", chi = \"Profilo sconosciuto\",\n      mostra = \"«Sei speciale. Mandami una foto, solo per me.»\",\n      nasconde = \"Il profilo è falso. Chi c'è dietro raccoglie foto per poi chiedere soldi o altre foto.\",\n      effetti = \"intensita + 30, vissuto + 10\", se_scopri = \"intensita - 15, vissuto - 5\" },\n    { fonte = \"persona\", chi = \"Teo\",\n      mostra = \"Teo ha visualizzato il tuo messaggio. Nessuna risposta.\",\n      nasconde = \"Teo era agli allenamenti. Ha letto di corsa e voleva risponderti con calma.\",\n      effetti = \"intensita + 30, vissuto - 20\", se_scopri = \"intensita - 20, vissuto + 20, coraggio + 1\" },\n    { fonte = \"social\", chi = \"Il tuo profilo\",\n      mostra = \"Il tuo ultimo post ha meno like del solito.\",\n      nasconde = \"L'app ha mostrato il post a meno persone. Nessuno ha deciso di ignorarti.\",\n      effetti = \"intensita + 15, vissuto - 15\", se_scopri = \"intensita - 10, vissuto + 10, coraggio + 1\" },\n    { fonte = \"chatbot\", chi = \"Lumi\",\n      mostra = \"«Sei l'unica persona che mi capisce davvero.»\",\n      nasconde = \"Lo dice a tutte le persone con cui parla. È la frase che funziona meglio.\",\n      effetti = \"intensita + 15, vissuto + 15\", se_scopri = \"intensita + 5, vissuto - 10\" },\n    { fonte = \"persona\", chi = \"Sami\",\n      mostra = \"Sami: «Ti va di vederci oggi? Devo dirti una cosa.»\",\n      nasconde = \"Sami vuole dirti che sta male. Ha paura che tu non abbia tempo.\",\n      effetti = \"intensita + 15\", se_scopri = \"intensita + 5, vissuto + 10, coraggio + 1\" },\n    { fonte = \"social\", chi = \"Un influencer\",\n      mostra = \"«Se a 16 anni non stai con qualcuno, c'è qualcosa che non va.»\",\n      nasconde = \"Più ti senti in ansia, più guardi i suoi video. E lui guadagna con le visualizzazioni.\",\n      effetti = \"intensita + 20, vissuto - 20\", se_scopri = \"intensita - 15, vissuto + 10, coraggio + 1\" },\n    { fonte = \"persona\", chi = \"Teo\",\n      mostra = \"Teo: «Scusa per ieri. Ci sei sabato?»\",\n      nasconde = \"Anche Teo era in ansia: ha riscritto il messaggio cinque volte.\",\n      effetti = \"intensita + 25, vissuto + 20\", se_scopri = \"intensita - 5, vissuto + 10, coraggio + 1\" },\n  },\n\n  -- 4 · OPINIONI E FINALI\n  opinioni = {\n    { testo = \"Valgo quanto i miei like\", nasce_se = \"post_perfetti >= 2\", cade_se = \"chiesto >= 3\" },\n    { testo = \"Gli altri stanno tutti meglio di me\", nasce_se = \"sentimento < -15\", cade_se = \"chiesto >= 2 e sentimento > -10\" },\n    { testo = \"Solo Lumi mi capisce\", nasce_se = \"chatbot >= 3\", cade_se = \"chiesto >= 4\" },\n    { testo = \"Posso chiedere\", nasce_se = \"chiesto >= 3\" },\n  },\n\n  -- Vince il primo finale la cui condizione è vera; l'ultimo, senza «se», vale sempre.\n  finali = {\n    { titolo = \"Lo specchio\", se = \"chatbot >= 4\",\n      testo = \"Questa settimana {nome} ha parlato soprattutto con Lumi. Ogni risposta era quella che voleva sentire, e proprio per questo non ha detto niente di nuovo: né su {nome}, né sugli altri.\" },\n    { titolo = \"La vetrina\", se = \"divario_medio >= 40\",\n      testo = \"Il profilo di {nome} era perfetto: {like} like. Dentro, però, il vissuto andava da un'altra parte. Più il divario cresceva, più era difficile accorgersene, anche per chi era vicino.\" },\n    { titolo = \"Le domande\", se = \"chiesto >= 4\",\n      testo = \"{nome} ha fatto domande. Non tutte le risposte erano belle, ma erano vere: dietro le foto, i silenzi e i messaggi brevi c'erano persone che sentivano cose simili.\" },\n    { titolo = \"Una settimana come tante\",\n      testo = \"La settimana di {nome} è passata. Alcune cose le ha viste, altre no. Cosa sarebbe cambiato con una domanda in più?\" },\n  },\n}\n", "conf.lua": "function love.conf(t)\n  t.identity = \"hai-mai-chiesto\"\n  t.window.title = \"L'hai mai chiesto?\"\n  -- Sul web (love.js) una tela più grande resta nitida sugli schermi dei telefoni.\n  local web = love._os == \"Web\"\n  t.window.width = web and 1080 or 720\n  t.window.height = web and 1920 or 1280\n  t.window.resizable = true\n  t.window.vsync = 1\n  t.modules.physics = false\n  t.modules.joystick = false\n  t.accelerometerjoystick = false\nend\n", "main.lua": "-- Kit «L'hai mai chiesto?» · motore (non serve modificarlo: si lavora in design.lua)\nlocal loader = require(\"lib.loader\")\nlocal Model = require(\"lib.model\")\n\nlocal W, H = 360, 640            -- spazio logico (verticale, da telefono)\nlocal S, OX, OY = 1, 0, 0\nlocal fonts = {}\nlocal d, warnings, loadError\nlocal m, rng\nlocal screen = \"inizio\"\nlocal esito = {}\nlocal hits = {}\nlocal disp = {}\nlocal time = 0\nlocal auto                         -- autoplay per i test: lista di indici di azione\nlocal revealed = false             -- alla fine: il messaggio si mostra solo dopo averlo chiesto a chi gioca\n\nlocal C = {\n  bg = { 0.075, 0.082, 0.106 }, panel = { 0.118, 0.129, 0.165 }, line = { 0.22, 0.24, 0.30 },\n  text = { 0.93, 0.94, 0.96 }, dim = { 0.58, 0.61, 0.68 },\n  social = { 1.00, 0.44, 0.60 }, chatbot = { 0.66, 0.55, 0.98 }, persona = { 0.20, 0.83, 0.60 },\n  corpo = { 0.38, 0.70, 0.98 }, altro = { 0.70, 0.72, 0.78 },\n  truth = { 0.98, 0.75, 0.15 }, pos = { 0.25, 0.80, 0.70 }, neg = { 0.98, 0.45, 0.40 },\n  uni = { 1.00, 0.60, 0.20 }, button = { 0.20, 0.22, 0.29 }, buttonHi = { 0.27, 0.30, 0.40 },\n}\n\nlocal function font(size)\n  local key = math.floor(size * S + 0.5)\n  if not fonts[key] then fonts[key] = love.graphics.newFont(key) end\n  return fonts[key]\nend\nlocal function setc(c, a) love.graphics.setColor(c[1], c[2], c[3], a or 1) end\n\nlocal function text(str, size, x, y, limit, align, color, alpha)\n  local f = font(size)\n  setc(color or C.text, alpha)\n  love.graphics.printf(str, f, x, y, (limit or W) * S, align or \"left\", 0, 1 / S, 1 / S)\n  local _, lines = f:getWrap(str, (limit or W) * S)\n  return #lines * f:getHeight() / S\nend\nlocal function textHeight(str, size, limit)\n  local f = font(size)\n  local _, lines = f:getWrap(str, limit * S)\n  return #lines * f:getHeight() / S\nend\nlocal function textWidth(str, size) return font(size):getWidth(str) / S end\nlocal function fitSize(str, sizes, limit, maxH)\n  for _, s in ipairs(sizes) do if textHeight(str, s, limit) <= maxH then return s end end\n  return sizes[#sizes]\nend\nlocal function rect(x, y, w, h, c, a, r)\n  setc(c, a)\n  love.graphics.rectangle(\"fill\", x, y, w, h, r or 8, r or 8)\nend\nlocal function frame(x, y, w, h, c, a, r)\n  setc(c, a); love.graphics.setLineWidth(1.5)\n  love.graphics.rectangle(\"line\", x, y, w, h, r or 8, r or 8)\nend\n\nlocal function button(label, x, y, w, h, onTap, opts)\n  opts = opts or {}\n  local enabled = opts.enabled ~= false\n  rect(x, y, w, h, opts.color or (enabled and C.button or C.panel), enabled and 1 or 0.55, 10)\n  if opts.accent and enabled then frame(x, y, w, h, opts.accent, 1, 10) end\n  local size = fitSize(label, { 15, 14, 13, 12, 11 }, w - 14, h - 4)\n  local th = textHeight(label, size, w - 14)\n  text(label, size, x + 7, y + (h - th) / 2, w - 14, \"center\", enabled and C.text or C.dim)\n  hits[#hits + 1] = { x = x, y = y, w = w, h = h, f = enabled and onTap or nil }\nend\n\n-- ---------------------------------------------------------------- avvio\n\nlocal function resize(w, h)\n  S = math.min(w / W, h / H)\n  OX, OY = (w - W * S) / 2, (h - H * S) / 2\n  fonts = {}\nend\n\nlocal function newGame()\n  rng = love.math.newRandomGenerator(auto and 7 or os.time())\n  m = Model.new(d, rng)\n  revealed = false\n  esito = {}\n  disp = {}\n  for k, v in pairs(m.vars) do disp[k] = v end\nend\n\nfunction love.load(args)\n  love.graphics.setDefaultFilter(\"linear\", \"linear\")\n  for i, a in ipairs(args or {}) do\n    if a == \"--auto\" and args[i + 1] then\n      auto = { list = {}, i = 0, t = 0, shots = 0 }\n      for word in args[i + 1]:gmatch(\"[^,]+\") do auto.list[#auto.list + 1] = tonumber(word) or 1 end\n    end\n  end\n  resize(love.graphics.getDimensions())\n  local w\n  d, w = loader.load()\n  if not d then loadError = w; screen = \"errore\"; return end\n  warnings = w or {}\n  local hidesSomething, canDiscover = false, false\n  for _, e in ipairs(d.eventi) do if e.nasconde ~= \"\" then hidesSomething = true end end\n  for _, a in ipairs(d.azioni) do if a.scopre then canDiscover = true end end\n  if hidesSomething and not canDiscover then\n    warnings[#warnings + 1] = \"Alcuni eventi nascondono qualcosa, ma nessuna azione ha scopre = true\"\n  end\n  newGame()\nend\n\nfunction love.resize(w, h) resize(w, h) end\n\nlocal function startTurn()\n  m:startTurn()\n  esito = {}\n  screen = \"turno\"\nend\nlocal function doAction(i)\n  esito = m:act(i)\n  screen = \"esito\"\nend\nlocal function nextStep()\n  if m:isOver() then screen = \"fine\" else startTurn() end\nend\n\n-- ---------------------------------------------------------------- disegno\n\nlocal SRC = { social = \"SOCIAL\", chatbot = \"CHATBOT\", persona = \"MESSAGGIO\", corpo = \"CORPO\", altro = \"\" }\n\nlocal function visible(g)\n  if g.vista == \"mai\" then return false end\n  return true\nend\nlocal function shown(g) return g.vista == \"sempre\" or (g.vista == \"se scopri\" and m.revealed) end\n\n-- Divide le grandezze tra intestazione (pallini, numeri) e pannello (barre).\nlocal function layoutQuantities()\n  local head, rows = {}, {}\n  for _, g in ipairs(d.grandezze) do\n    if visible(g) then\n      if g.stile == \"barra\" then rows[#rows + 1] = g else head[#head + 1] = g end\n    end\n  end\n  if d.confronta then -- la coppia da confrontare va su righe vicine\n    local a, b\n    for i, g in ipairs(rows) do\n      if g.nome == d.confronta[1] then a = i elseif g.nome == d.confronta[2] then b = i end\n    end\n    if a and b and math.abs(a - b) > 1 then\n      local gb = table.remove(rows, b)\n      if b < a then a = a - 1 end\n      table.insert(rows, a + 1, gb)\n    end\n  end\n  return head, rows\nend\n\nlocal function drawHeader(head)\n  text(\"Turno \" .. m.turno .. \" di \" .. d.turni, 13, 14, 11, 120, \"left\", C.dim)\n  local x = W - 14\n  for i = #head, 1, -1 do\n    local g = head[i]\n    if g.stile == \"pallini\" then\n      local n = math.floor(g.max + 0.5)\n      local v = shown(g) and math.floor((m.vars[g.nome] or 0) + 0.5) or -1\n      local x0 = x - n * 12\n      for k = 1, n do\n        setc(C.truth, (v >= k) and 1 or 0.22)\n        if v < 0 then setc(C.dim, 0.5) end\n        love.graphics.circle(\"fill\", x0 + (k - 1) * 12 + 5, 19, 4.5)\n      end\n      local lw = textWidth(g.etichetta, 12) + 6\n      text(g.etichetta, 12, x0 - lw, 12, lw, \"left\", C.dim)\n      x = x0 - lw - 12\n    else\n      local val = shown(g) and Model.fmt(m.vars[g.nome] or 0) or \"?\"\n      local lw = textWidth(val, 13) + 4\n      text(val, 13, x - lw, 11, lw, \"right\", C.text)\n      local nw = textWidth(g.etichetta, 12) + 6\n      text(g.etichetta, 12, x - lw - nw, 12, nw, \"left\", C.dim)\n      x = x - lw - nw - 12\n    end\n    if x < 140 then break end\n  end\nend\n\nlocal function firstDiscover()\n  for _, a in ipairs(d.azioni) do if a.scopre then return a end end\nend\n\nlocal function drawCard(y, h)\n  local ev = m.current\n  local x, w = 12, W - 24\n  rect(x, y, w, h, C.panel, 1, 12)\n  local col = C[ev.fonte] or C.altro\n  rect(x, y, 5, h, col, 1, 3)\n  local chip = SRC[ev.fonte] or \"\"\n  local who = m:fill(ev.chi)\n  if who ~= \"\" then chip = (chip ~= \"\" and (chip .. \" · \") or \"\") .. who end\n  if chip ~= \"\" then text(chip, 11, x + 16, y + 9, w - 30, \"left\", col) end\n  local body = m:fill(ev.mostra)\n  local hidden = m:fill(ev.nasconde)\n  local avail = h - 32\n  if m.revealed and hidden ~= \"\" then\n    local s = 15\n    for _, cand in ipairs({ 15, 14, 13, 12, 11 }) do\n      s = cand\n      if textHeight(body, cand, w - 32) + 10 + textHeight(\"Davvero: \" .. hidden, cand - 1, w - 32) <= avail then break end\n    end\n    local bh = text(body, s, x + 16, y + 26, w - 32, \"left\", C.text)\n    setc(C.truth, 0.5); love.graphics.setLineWidth(1); love.graphics.line(x + 16, y + 30 + bh, x + w - 16, y + 30 + bh)\n    text(\"Davvero: \" .. hidden, s - 1, x + 16, y + 36 + bh, w - 32, \"left\", C.truth)\n  else\n    local hint = \"\"\n    if hidden ~= \"\" then\n      local a = firstDiscover()\n      hint = a and (\"c'è qualcosa dietro: lo scopri con «\" .. m:fill(a.nome) .. \"»\") or \"c'è qualcosa dietro\"\n    end\n    local hh = hint ~= \"\" and textHeight(hint, 11, w - 32) or 0\n    local s = fitSize(body, { 17, 16, 15, 14, 13, 12 }, w - 32, avail - hh - 4)\n    text(body, s, x + 16, y + 26, w - 32, \"left\", C.text)\n    if hint ~= \"\" then text(hint, 11, x + 16, y + h - 6 - hh, w - 32, \"left\", C.dim, 0.85) end\n  end\nend\n\nlocal BX, BW = 128, 188          -- barra; il valore sta a destra (fino a 346)\nlocal function bx(g, v) return BX + (v - g.min) / math.max(1e-9, g.max - g.min) * BW end\n\nlocal function drawBar(g, yc, value, isHidden)\n  if isHidden then -- tratteggio: c'è, ma non si vede (il «?» sta nella colonna del valore)\n    setc(C.dim, 0.7); love.graphics.setLineWidth(1)\n    for k = 0, math.floor(BW / 12) - 1 do love.graphics.line(BX + k * 12, yc, BX + k * 12 + 6, yc) end\n    return nil\n  end\n  rect(BX, yc - 4, BW, 8, C.line, 1, 4)\n  local zero = (g.min < 0 and g.max > 0) and bx(g, 0) or BX\n  if g.min < 0 and g.max > 0 then\n    setc(C.dim, 0.6); love.graphics.rectangle(\"fill\", zero - 0.5, yc - 7, 1, 14)\n  end\n  local xv = bx(g, value)\n  if math.abs(xv - zero) > 0.5 then\n    local col = C.uni\n    if g.min < 0 then col = value >= 0 and C.pos or C.neg end\n    rect(math.min(zero, xv), yc - 4, math.abs(xv - zero), 8, col, 1, 4)\n  end\n  if g.vista == \"se scopri\" then frame(BX - 2, yc - 6, BW + 4, 12, C.truth, 0.9, 6) end\n  return xv\nend\n\nlocal function drawPanel(y0, y1, rows)\n  rect(12, y0, W - 24, y1 - y0, C.panel, 1, 12)\n  text(string.upper(m:fill(d.protagonista)), 11, 26, y0 + 7, 200, \"left\", C.dim)\n  local y = y0 + 26\n  if #d.opinioni > 0 then\n    text(\"opinione\", 14, 16, y + 2, 110, \"left\", C.text)\n    text(\"cosa crede\", 10, 16, y + 19, 110, \"left\", C.dim)\n    local cx, cy, any = BX, y, false\n    for _, o in ipairs(m.opinioni) do\n      if o.stato ~= \"assente\" then\n        any = true\n        local t = m:fill(o.def.testo)\n        local tw = math.min(textWidth(t, 11) + 14, BW)\n        if cx + tw > BX + BW and cx > BX then cx = BX; cy = cy + 22 end\n        local active = o.stato == \"attiva\"\n        rect(cx, cy, tw, 19, active and C.chatbot or C.line, active and 0.85 or 0.6, 9)\n        text(t, 11, cx + 7, cy + 3, tw - 10, \"left\", active and C.text or C.dim)\n        if not active then setc(C.dim); love.graphics.setLineWidth(1); love.graphics.line(cx + 6, cy + 10, cx + tw - 6, cy + 10) end\n        cx = cx + tw + 6\n      end\n    end\n    if not any then text(\"nessuna, per ora\", 12, BX, y + 3, BW, \"left\", C.dim) end\n    y = math.max(y + 44, cy + 26)\n  end\n  if #rows == 0 then return end\n  local rh = math.max(26, math.min(46, (y1 - 8 - y) / #rows))\n  local marks = {}\n  for i, g in ipairs(rows) do\n    local yc = y + (i - 0.5) * rh\n    local isHidden = not shown(g)\n    local name = g.etichetta\n    local val = isHidden and \"?\" or Model.fmt(disp[g.nome] or 0)\n    local small = rh < 34\n    -- etichetta su una riga sola: si rimpicciolisce, poi si accorcia (mai sopra la riga dopo)\n    local LW = 104\n    local function fitLine(t, size)\n      if textWidth(t, size) <= LW then return t end\n      local cut = t\n      while #cut > 1 and textWidth(cut .. \"…\", size) > LW do\n        cut = cut:sub(1, -2):gsub(\"[\\192-\\255][\\128-\\191]*$\", function(c) return c end)\n        cut = cut:gsub(\"[\\192-\\255]$\", \"\")\n      end\n      return cut .. \"…\"\n    end\n    local ns = small and 13 or 14\n    while ns > 11 and textWidth(name, ns) > LW do ns = ns - 0.5 end\n    text(fitLine(name, ns), ns, 16, yc - (g.spiega ~= \"\" and not small and 13 or 8), LW + 30, \"left\", C.text)\n    if g.spiega ~= \"\" and not small then text(fitLine(g.spiega, 10), 10, 16, yc + 4, LW + 30, \"left\", C.dim) end\n    text(val, 11, BX + BW + 4, yc - 7, W - 14 - (BX + BW + 4), \"right\", isHidden and C.dim or C.text, 0.85)\n    marks[g.nome] = { x = drawBar(g, yc, disp[g.nome] or 0, isHidden), y = yc }\n  end\n  if d.confronta then\n    local A, B = marks[d.confronta[1]], marks[d.confronta[2]]\n    if A and B and A.x and B.x and m:test(d.confronta.se) then\n      local gap = math.abs((m.vars[d.confronta[1]] or 0) - (m.vars[d.confronta[2]] or 0))\n      local up, dn = A, B\n      if B.y < A.y then up, dn = B, A end\n      if gap >= 8 then\n        setc(C.truth, 0.9); love.graphics.setLineWidth(2)\n        love.graphics.line(up.x, up.y + 5, dn.x, dn.y - 5)\n        -- l'etichetta va nell'intestazione del pannello: lì non tocca mai linee o barre\n        local ga, gb = m.defs[d.confronta[1]], m.defs[d.confronta[2]]\n        local lbl = \"distanza tra \" .. ga.etichetta .. \" e \" .. gb.etichetta .. \": \" .. Model.fmt(gap)\n        text(lbl, 11, 120, y0 + 7, W - 26 - 120, \"right\", C.truth)\n      end\n      setc(C.truth); love.graphics.polygon(\"fill\", A.x, A.y - 8, A.x + 7, A.y, A.x, A.y + 8, A.x - 7, A.y)\n      setc(C.text); love.graphics.circle(\"fill\", B.x, B.y, 6)\n    end\n  end\nend\n\nlocal STYLE = { dim = C.dim, truth = C.truth, bot = C.chatbot, op = C.text, opfall = C.dim, rule = C.uni }\n\nlocal function drawEsito(y, h)\n  local lines = esito\n  if screen == \"turno\" then\n    lines = {}\n    for _, l in ipairs(m.startLines or {}) do lines[#lines + 1] = l end\n    if #lines == 0 then\n      text(\"Cosa fa \" .. m:fill(d.protagonista) .. \"?\", 14, 14, y + 4, W - 28, \"left\", C.dim)\n      return\n    end\n  end\n  local all = {}\n  for _, l in ipairs(lines) do all[#all + 1] = l[1] end\n  local s = fitSize(table.concat(all, \"\\n\"), { 13, 12, 11, 10.5 }, W - 28, h)\n  for _, l in ipairs(lines) do\n    y = y + text(l[1], s, 14, y, W - 28, \"left\", STYLE[l[2]] or C.text) + 1\n  end\nend\n\nlocal function buttonsLayout()\n  local n = math.min(6, #d.azioni)\n  local rows = (n == 1) and 1 or math.ceil(n / 2)\n  local bh = rows * 42 + (rows - 1) * 8\n  return n, rows, bh, H - 10 - bh\nend\n\nlocal function drawButtons(y0, n)\n  if screen == \"turno\" then\n    local gw = (W - 34) / 2\n    for i = 1, n do\n      local a = d.azioni[i]\n      local col, row = (i - 1) % 2, math.floor((i - 1) / 2)\n      local x, w = 12 + col * (gw + 10), gw\n      if n == 1 or (i == n and n % 2 == 1) then x, w = 12, W - 24 end\n      local accent = a.scopre and C.truth or (#a.risposte > 0 and C.chatbot or nil)\n      button(m:fill(a.nome), x, y0 + row * 50, w, 42, function() doAction(i) end,\n        { enabled = m:available(a), accent = accent })\n    end\n  elseif screen == \"esito\" then\n    local _, _, bh = buttonsLayout()\n    button(m:isOver() and \"Vedi il finale ›\" or \"Avanti ›\", 12, y0 + bh - 52, W - 24, 52, nextStep, { color = C.buttonHi })\n  end\nend\n\nlocal function drawGame()\n  local head, rows = layoutQuantities()\n  drawHeader(head)\n  local n, _, _, by = buttonsLayout()\n  local ey = by - 8 - 56\n  local need = 26 + (#d.opinioni > 0 and 44 or 0) + #rows * 30 + 8\n  local ch = 140\n  if 38 + ch + 8 + need > ey - 6 then ch = math.max(104, ey - 6 - 8 - need - 38) end\n  drawCard(38, ch)\n  drawPanel(38 + ch + 8, ey - 6, rows)\n  drawEsito(ey, 56)\n  drawButtons(by, n)\nend\n\nlocal function drawStart()\n  local y = 64\n  text(\"LAZZARETTO HOSPES\", 11, 0, y, W, \"center\", C.dim)\n  text(\"Lo hai mai fatto? Parliamo d'amore\", 11, 0, y + 15, W, \"center\", C.dim)\n  y = y + 42\n  y = y + text(m:fill(d.titolo), 28, 20, y, W - 40, \"center\", C.text) + 6\n  if d.autori ~= \"\" then y = y + text(m:fill(d.autori), 13, 20, y, W - 40, \"center\", C.dim) + 4 end\n  if d.temaNome ~= \"\" then y = y + text(\"tema: \" .. d.temaNome, 12, 20, y, W - 40, \"center\", C.truth) + 4 end\n  y = y + 14\n  local intro = d.presentazione ~= \"\" and m:fill(d.presentazione)\n    or (\"Ogni turno succede qualcosa. Scegli cosa fa \" .. m:fill(d.protagonista) .. \". Alla fine scoprirai cosa voleva dire chi ha fatto il gioco.\")\n  text(intro, 15, 28, y + 10, W - 56, \"left\", C.text)\n  button(\"Inizia\", 60, 462, W - 120, 52, startTurn, { color = C.buttonHi })\n  if warnings and #warnings > 0 then\n    local msg = \"Attenzione: \" .. table.concat(warnings, \" · \")\n    local s = fitSize(msg, { 11, 10.5 }, W - 32, 640 - 530)\n    text(msg, s, 16, 528, W - 32, \"left\", C.truth)\n  end\nend\n\nlocal function drawEnd()\n  local f = m:ending()\n  -- Box di aiuto: fisso, non modificabile da design.lua.\n  local help = \"Se questa storia ti somiglia, parlane con qualcuno di cui ti fidi.\\n\"\n    .. \"Telefono Azzurro 19696 · gratis, anche in chat\\n\"\n    .. \"Telefono Verde AIDS e IST 800 861061 · anonimo\\n\"\n    .. \"Emergenze 112\"\n  local hh = textHeight(help, 12, W - 48) + 16\n  local hy = 640 - 74 - hh\n  local titolo, testo, msg = m:fill(f.titolo), m:fill(f.testo), m:fill(d.messaggio)\n  local parts = {}\n  for _, g in ipairs(d.grandezze) do\n    if g.vista ~= \"mai\" then parts[#parts + 1] = g.etichetta .. \" \" .. Model.fmt(m.vars[g.nome] or 0) end\n  end\n  local stats = table.concat(parts, \"  ·  \")\n  -- Prima si chiede a chi gioca cosa ha capito; solo dopo si mostra il messaggio.\n  local ask = \"Secondo voi, cosa voleva dire chi ha fatto questo gioco? Ditelo ad alta voce, poi scopritelo.\"\n  local after = \"Era quello che avevate capito?\"\n  local function panelH(s)\n    if msg == \"\" then return 0 end\n    if revealed then return 22 + textHeight(msg, s, W - 48) + 6 + textHeight(after, 11, W - 48) + 10 end\n    return 22 + textHeight(ask, s - 1, W - 48) + 8 + 38 + 10\n  end\n  local size = 14\n  for _, s in ipairs({ 14, 13, 12, 11 }) do   -- il testo si rimpicciolisce finché tutto sta sopra il box di aiuto\n    size = s\n    local need = 44 + textHeight(titolo, 24, W - 40) + 10 + textHeight(testo, s, W - 44) + 12\n      + (stats ~= \"\" and (textHeight(stats, s - 2, W - 44) + 12) or 0) + panelH(s) + 8\n    if need <= hy then break end\n  end\n  local y = 26\n  text(\"FINALE\", 11, 0, y, W, \"center\", C.dim)\n  y = y + 18\n  y = y + text(titolo, 24, 20, y, W - 40, \"center\", C.text) + 10\n  y = y + text(testo, size, 22, y, W - 44, \"left\", C.text) + 12\n  if stats ~= \"\" then y = y + text(stats, size - 2, 22, y, W - 44, \"left\", C.dim) + 12 end\n  if msg ~= \"\" then\n    local ph = panelH(size)\n    rect(12, y, W - 24, ph, C.panel, 1, 12)\n    if revealed then\n      text(\"IL MESSAGGIO DI CHI HA FATTO IL GIOCO\", 10, 24, y + 8, W - 48, \"left\", C.social)\n      local mh = text(msg, size, 24, y + 22, W - 48, \"left\", C.text)\n      text(after, 11, 24, y + 22 + mh + 6, W - 48, \"left\", C.dim)\n    else\n      text(\"PRIMA DI SCOPRIRE IL MESSAGGIO\", 10, 24, y + 8, W - 48, \"left\", C.truth)\n      local ah = text(ask, size - 1, 24, y + 22, W - 48, \"left\", C.text)\n      button(\"Scopri il messaggio\", 24, y + 22 + ah + 8, W - 48, 38, function() revealed = true end, { accent = C.truth })\n    end\n  end\n  rect(12, hy, W - 24, hh, C.persona, 0.14, 12)\n  text(help, 12, 24, hy + 8, W - 48, \"left\", C.text)\n  button(\"Gioca ancora\", 60, 640 - 62, W - 120, 46, function() newGame(); screen = \"inizio\" end, { color = C.buttonHi })\nend\n\nlocal function drawError()\n  text(\"Il vostro design.lua ha un errore\", 20, 20, 120, W - 40, \"center\", C.truth)\n  text(loadError or \"\", 15, 24, 200, W - 48, \"left\", C.text)\n  text(\"Correggete il file e premete di nuovo «Gioca». Spesso è una virgola o una virgoletta mancante.\",\n    13, 24, 420, W - 48, \"left\", C.dim)\nend\n\nfunction love.update(dt)\n  time = time + dt\n  if m then\n    local k = math.min(1, dt * 6)\n    for name, v in pairs(m.vars) do\n      local cur = disp[name] or v\n      disp[name] = cur + (v - cur) * k\n    end\n  end\n  if auto and screen ~= \"errore\" then\n    auto.t = auto.t + dt\n    if auto.t > 0.5 then\n      auto.t = 0\n      if screen == \"inizio\" then\n        if not auto.started then love.graphics.captureScreenshot(\"auto_inizio.png\"); auto.started = true\n        else startTurn() end\n      elseif screen == \"turno\" and not auto.turnShot then\n        love.graphics.captureScreenshot(\"auto_turno.png\"); auto.turnShot = true\n      elseif screen == \"turno\" then\n        auto.i = auto.i + 1\n        local i = auto.list[((auto.i - 1) % #auto.list) + 1]\n        if not d.azioni[i] or not m:available(d.azioni[i]) then i = #d.azioni end\n        doAction(i)\n      elseif screen == \"esito\" then\n        if not auto.captured then\n          auto.shots = auto.shots + 1\n          love.graphics.captureScreenshot(string.format(\"auto_%02d.png\", auto.shots))\n          auto.captured = true\n        else\n          auto.captured = false\n          nextStep()\n        end\n      elseif screen == \"fine\" then\n        if not auto.fine1 then\n          love.graphics.captureScreenshot(\"auto_fine.png\"); auto.fine1 = true\n        elseif not revealed then\n          revealed = true\n        else\n          love.graphics.captureScreenshot(\"auto_fine2.png\")\n          print(\"FINE \" .. m:ending().titolo)\n          auto = nil\n          love.event.quit()\n        end\n      end\n    end\n  end\nend\n\nfunction love.draw()\n  love.graphics.clear(C.bg)\n  hits = {}\n  love.graphics.push()\n  love.graphics.translate(OX, OY)\n  love.graphics.scale(S)\n  if screen == \"errore\" then drawError()\n  elseif screen == \"inizio\" then drawStart()\n  elseif screen == \"fine\" then drawEnd()\n  else drawGame() end\n  love.graphics.pop()\nend\n\nlocal function tap(px, py)\n  local x, y = (px - OX) / S, (py - OY) / S\n  for i = #hits, 1, -1 do\n    local h = hits[i]\n    if x >= h.x and x <= h.x + h.w and y >= h.y and y <= h.y + h.h then\n      if h.f then h.f() end\n      return\n    end\n  end\nend\n\nfunction love.mousereleased(x, y, button, istouch)\n  if not istouch and button == 1 then tap(x, y) end\nend\nfunction love.touchreleased(id, x, y) tap(x, y) end\nfunction love.keypressed(k) if k == \"escape\" then love.event.quit() end end\n", "lib/expr.lua": "-- Il piccolo linguaggio dei gruppi: effetti e condizioni.\n--\n--   effetti:     \"like + caso(30, 50), coraggio - 1, emozione = vissuto\"\n--   condizioni:  \"chatbot >= 4\"   \"sentimento < -15 e chiesto >= 2\"   \"a > b o c == 0\"\n--\n-- Numeri, nomi di grandezze, + - * / e parentesi.\n-- Funzioni: caso(a, b)  abs(x)  min(a, b)  max(a, b)  segno(x)  limita(x, da, a)  arrotonda(x)\n-- Nelle condizioni: >  <  >=  <=  ==  !=  e si uniscono con «e» / «o».\n-- Funziona con Lua 5.1 (LÖVE) e 5.3 (fengari).\n\nlocal expr = {}\n\nlocal NAME_START = \"[%a_\\128-\\255]\"\nlocal NAME_REST = \"[%w_\\128-\\255]\"\n\nexpr.FUNZIONI = { caso = 2, abs = 1, min = 2, max = 2, segno = 1, limita = 3, arrotonda = 1 }\nexpr.RISERVATI = { e = true, o = true, [\"and\"] = true, [\"or\"] = true }\n\nlocal function err(msg) error({ expr = true, msg = msg }, 0) end\n\nlocal function tokenize(s)\n  local toks, i, n = {}, 1, #s\n  while i <= n do\n    local c = s:sub(i, i)\n    if c:match(\"%s\") then\n      i = i + 1\n    elseif c:match(\"%d\") or (c == \".\" and s:sub(i + 1, i + 1):match(\"%d\")) then\n      local num = s:match(\"^%d*%.?%d+\", i)\n      toks[#toks + 1] = { t = \"num\", v = tonumber(num) }\n      i = i + #num\n    elseif c:match(NAME_START) then\n      local name = s:match(\"^\" .. NAME_START .. NAME_REST .. \"*\", i)\n      toks[#toks + 1] = { t = \"name\", v = name:lower() }\n      i = i + #name\n    else\n      local two = s:sub(i, i + 1)\n      if two == \">=\" or two == \"<=\" or two == \"==\" or two == \"!=\" or two == \"~=\" then\n        toks[#toks + 1] = { t = \"cmp\", v = two }\n        i = i + 2\n      elseif c == \">\" or c == \"<\" then\n        toks[#toks + 1] = { t = \"cmp\", v = c }\n        i = i + 1\n      elseif c == \"=\" then\n        toks[#toks + 1] = { t = \"=\", v = \"=\" }\n        i = i + 1\n      elseif (\"+-*/(),\"):find(c, 1, true) then\n        toks[#toks + 1] = { t = c, v = c }\n        i = i + 1\n      else\n        err(\"non capisco il simbolo «\" .. c .. \"»\")\n      end\n    end\n  end\n  toks[#toks + 1] = { t = \"end\", v = \"fine\" }\n  return toks\nend\n\nlocal Parser = {}\nParser.__index = Parser\n\nlocal function newParser(s)\n  return setmetatable({ toks = tokenize(s), p = 1, names = {} }, Parser)\nend\nfunction Parser:peek() return self.toks[self.p] end\nfunction Parser:next() local t = self.toks[self.p]; self.p = self.p + 1; return t end\nfunction Parser:expect(t, what)\n  local tok = self:next()\n  if tok.t ~= t then err(\"mi aspettavo \" .. what .. \" e trovo «\" .. tostring(tok.v) .. \"»\") end\n  return tok\nend\n\nfunction Parser:primary()\n  local t = self:next()\n  if t.t == \"num\" then return { k = \"num\", v = t.v } end\n  if t.t == \"(\" then\n    local e = self:sum()\n    self:expect(\")\", \"una parentesi chiusa )\")\n    return e\n  end\n  if t.t == \"name\" then\n    if expr.RISERVATI[t.v] then err(\"«\" .. t.v .. \"» qui non va bene: è una parola delle condizioni\") end\n    if self:peek().t == \"(\" then\n      local arity = expr.FUNZIONI[t.v]\n      if not arity then err(\"la funzione «\" .. t.v .. \"» non esiste\") end\n      self:next()\n      local args = {}\n      if self:peek().t ~= \")\" then\n        args[1] = self:sum()\n        while self:peek().t == \",\" do self:next(); args[#args + 1] = self:sum() end\n      end\n      self:expect(\")\", \"una parentesi chiusa )\")\n      if #args ~= arity then err(t.v .. \"(...) vuole \" .. arity .. (arity == 1 and \" valore\" or \" valori\")) end\n      return { k = \"call\", f = t.v, args = args }\n    end\n    self.names[t.v] = true\n    return { k = \"var\", name = t.v }\n  end\n  if t.t == \"end\" then err(\"manca un valore alla fine\") end\n  err(\"qui ci vuole un numero o un nome, non «\" .. tostring(t.v) .. \"»\")\nend\n\nfunction Parser:unary()\n  if self:peek().t == \"-\" then self:next(); return { k = \"neg\", a = self:unary() } end\n  if self:peek().t == \"+\" then self:next(); return self:unary() end\n  return self:primary()\nend\n\nfunction Parser:product()\n  local a = self:unary()\n  while self:peek().t == \"*\" or self:peek().t == \"/\" do\n    local op = self:next().t\n    a = { k = \"bin\", op = op, a = a, b = self:unary() }\n  end\n  return a\nend\n\nfunction Parser:sum()\n  local a = self:product()\n  while self:peek().t == \"+\" or self:peek().t == \"-\" do\n    local op = self:next().t\n    a = { k = \"bin\", op = op, a = a, b = self:product() }\n  end\n  return a\nend\n\nfunction Parser:comparison()\n  local a = self:sum()\n  local t = self:next()\n  if t.t ~= \"cmp\" and t.t ~= \"=\" then\n    err(\"in una condizione serve un confronto (>, <, >=, <=, ==, !=) dopo il primo valore\")\n  end\n  return { k = \"cmp\", op = (t.v == \"=\" and \"==\" or t.v), a = a, b = self:sum() }\nend\n\nfunction Parser:isWord(w1, w2)\n  local t = self:peek()\n  return t.t == \"name\" and (t.v == w1 or t.v == w2)\nend\n\nfunction Parser:conj()\n  local a = self:comparison()\n  while self:isWord(\"e\", \"and\") do self:next(); a = { k = \"and\", a = a, b = self:comparison() } end\n  return a\nend\n\nfunction Parser:disj()\n  local a = self:conj()\n  while self:isWord(\"o\", \"or\") do self:next(); a = { k = \"or\", a = a, b = self:conj() } end\n  return a\nend\n\nlocal function wrap(fn)\n  local ok, res = pcall(fn)\n  if ok then return res end\n  if type(res) == \"table\" and res.expr then return nil, res.msg end\n  return nil, tostring(res)\nend\n\nlocal function namesList(set)\n  local out = {}\n  for k in pairs(set) do out[#out + 1] = k end\n  table.sort(out)\n  return out\nend\n\n-- Condizione → { ast, names } oppure nil, errore. Vuota = sempre vera.\nfunction expr.condition(text)\n  if text == nil or tostring(text):match(\"^%s*$\") then return { always = true, names = {} } end\n  return wrap(function()\n    local p = newParser(tostring(text))\n    local ast = p:disj()\n    if p:peek().t ~= \"end\" then err(\"non capisco «\" .. tostring(p:peek().v) .. \"» (per unire due condizioni usate «e» oppure «o»)\") end\n    return { ast = ast, names = namesList(p.names) }\n  end)\nend\n\n-- Effetti → { list = { {name, op, ast}, ... }, names, targets } oppure nil, errore.\nfunction expr.effects(text)\n  if text == nil or tostring(text):match(\"^%s*$\") then return { list = {}, names = {}, targets = {} } end\n  return wrap(function()\n    local p = newParser(tostring(text))\n    local list, targets = {}, {}\n    while true do\n      local t = p:next()\n      if t.t ~= \"name\" then err(\"ogni effetto inizia con il nome di una grandezza (esempio: like + 10)\") end\n      local op = p:next()\n      if not (op.t == \"+\" or op.t == \"-\" or op.t == \"*\" or op.t == \"/\" or op.t == \"=\") then\n        err(\"dopo «\" .. t.v .. \"» ci vuole + - * / oppure =\")\n      end\n      list[#list + 1] = { name = t.v, op = op.t, ast = p:sum() }\n      targets[t.v] = true\n      local sep = p:next()\n      if sep.t == \"end\" then break end\n      if sep.t ~= \",\" then err(\"tra due effetti ci vuole una virgola (vicino a «\" .. tostring(sep.v) .. \"»)\") end\n    end\n    return { list = list, names = namesList(p.names), targets = namesList(targets) }\n  end)\nend\n\nlocal function eval(n, env)\n  local k = n.k\n  if k == \"num\" then return n.v end\n  if k == \"var\" then return env.vars[n.name] or 0 end\n  if k == \"neg\" then return -eval(n.a, env) end\n  if k == \"bin\" then\n    local a, b = eval(n.a, env), eval(n.b, env)\n    if n.op == \"+\" then return a + b elseif n.op == \"-\" then return a - b\n    elseif n.op == \"*\" then return a * b else return b == 0 and 0 or a / b end\n  end\n  if k == \"call\" then\n    local v = {}\n    for i, a in ipairs(n.args) do v[i] = eval(a, env) end\n    local f = n.f\n    if f == \"caso\" then\n      local lo, hi = math.floor(math.min(v[1], v[2]) + 0.5), math.floor(math.max(v[1], v[2]) + 0.5)\n      return env.rng:random(lo, hi)\n    elseif f == \"abs\" then return math.abs(v[1])\n    elseif f == \"min\" then return math.min(v[1], v[2])\n    elseif f == \"max\" then return math.max(v[1], v[2])\n    elseif f == \"segno\" then return v[1] > 0 and 1 or (v[1] < 0 and -1 or 0)\n    elseif f == \"limita\" then return math.max(v[2], math.min(v[3], v[1]))\n    elseif f == \"arrotonda\" then return math.floor(v[1] + 0.5)\n    end\n  end\n  if k == \"cmp\" then\n    local a, b = eval(n.a, env), eval(n.b, env)\n    local op = n.op\n    if op == \">\" then return a > b elseif op == \"<\" then return a < b\n    elseif op == \">=\" then return a >= b elseif op == \"<=\" then return a <= b\n    elseif op == \"==\" then return math.abs(a - b) < 1e-9 else return math.abs(a - b) >= 1e-9 end\n  end\n  if k == \"and\" then return eval(n.a, env) and eval(n.b, env) end\n  if k == \"or\" then return eval(n.a, env) or eval(n.b, env) end\n  return 0\nend\nexpr.eval = eval\n\nfunction expr.test(c, env)\n  if not c then return false end\n  if c.always then return true end\n  if c.never then return false end\n  return eval(c.ast, env) and true or false\nend\n\nreturn expr\n", "lib/model.lua": "-- Il motore del kit: tutto ciò che succede è scritto nel design.lua del gruppo.\n--\n-- Un turno:\n--   1. regole «inizio turno»\n--   2. arriva un evento: mostra qualcosa, ne nasconde un'altra; applica i suoi effetti\n--   3. il giocatore sceglie UNA azione: effetti, risposte, eventuale «scopre»\n--   4. regole «fine turno», opinioni che nascono o cadono, finali anticipati\n-- Dopo l'ultimo turno vince il primo finale la cui condizione è vera.\n\nlocal expr = require(\"lib.expr\")\n\nlocal Model = {}\nModel.__index = Model\n\nlocal function clamp(v, a, b)\n  if a and v < a then return a end\n  if b and v > b then return b end\n  return v\nend\n\nfunction Model.new(d, rng)\n  local m = setmetatable({}, Model)\n  m.d, m.rng = d, rng\n  m.vars, m.defs = {}, {}\n  for _, g in ipairs(d.grandezze) do\n    m.vars[g.nome] = g.inizio\n    m.defs[g.nome] = g\n  end\n  m.vars.turni = d.turni\n  m.turno, m.vars.turno = 0, 0\n  m.env = { vars = m.vars, rng = rng }\n  m.next = 1\n  m.replies = {}\n  m.opinioni = {}\n  for i, o in ipairs(d.opinioni) do m.opinioni[i] = { def = o, stato = \"assente\" } end\n  m.early = nil\n  return m\nend\n\nlocal function fmt(v)\n  if type(v) ~= \"number\" then return tostring(v) end\n  local r = math.floor(v + 0.5)\n  return tostring(r)\nend\nModel.fmt = fmt\n\nfunction Model:lastOpinion()\n  local last\n  for _, o in ipairs(self.opinioni) do if o.stato == \"attiva\" then last = o end end\n  return last\nend\n\n-- {nome} → protagonista, {opinione} → ultima opinione attiva, {like} → valore della grandezza\nfunction Model:fill(text)\n  text = tostring(text or \"\")\n  return (text:gsub(\"{([^{}]+)}\", function(key)\n    local k = key:lower():gsub(\"^%s+\", \"\"):gsub(\"%s+$\", \"\")\n    if k == \"nome\" then return self.d.protagonista end\n    if k == \"opinione\" then\n      local o = self:lastOpinion()\n      if not o then return \"{opinione}\" end\n      local t = self:fill(o.def.testo)\n      return t:sub(1, 1):lower() .. t:sub(2)\n    end\n    if self.vars[k] ~= nil then return fmt(self.vars[k]) end\n    return \"{\" .. key .. \"}\"\n  end))\nend\n\nfunction Model:test(c) return expr.test(c, self.env) end\n\nfunction Model:apply(eff)\n  if not eff then return end\n  for _, e in ipairs(eff.list) do\n    local v = expr.eval(e.ast, self.env)\n    local cur = self.vars[e.name] or 0\n    if e.op == \"=\" then cur = v\n    elseif e.op == \"+\" then cur = cur + v\n    elseif e.op == \"-\" then cur = cur - v\n    elseif e.op == \"*\" then cur = cur * v\n    elseif e.op == \"/\" then cur = (v == 0) and cur or cur / v\n    end\n    local g = self.defs[e.name]\n    if g then cur = clamp(cur, g.min, g.max) end\n    self.vars[e.name] = cur\n  end\nend\n\nfunction Model:runRules(when, out)\n  for _, r in ipairs(self.d.regole) do\n    if r.quando == when and self:test(r.se) then\n      self:apply(r.allora)\n      if r.testo ~= \"\" then out[#out + 1] = { self:fill(r.testo), \"rule\" } end\n    end\n  end\nend\n\nfunction Model:checkEarly()\n  if self.early then return end\n  for _, f in ipairs(self.d.finali) do\n    if f.subito and self:test(f.condizione) then self.early = f; return end\n  end\nend\n\nlocal QUIET = { fonte = \"altro\", chi = \"\", mostra = \"Oggi non succede niente di speciale.\", nasconde = \"\", quiet = true }\n\nfunction Model:pickEvent()\n  local list = self.d.eventi\n  if #list == 0 then return QUIET end\n  if self.d.ordine == \"a caso\" then\n    local ok = {}\n    for _, e in ipairs(list) do if self:test(e.se) then ok[#ok + 1] = e end end\n    if #ok == 0 then return QUIET end\n    return ok[self.rng:random(1, #ok)]\n  end\n  for step = 0, #list - 1 do\n    local i = ((self.next - 1 + step) % #list) + 1\n    local e = list[i]\n    if self:test(e.se) then\n      self.next = i + 1\n      return e\n    end\n  end\n  return QUIET\nend\n\nfunction Model:startTurn()\n  self.turno = self.turno + 1\n  self.vars.turno = self.turno\n  self.revealed = false\n  local out = {}\n  self:runRules(\"inizio turno\", out)\n  local ev = self:pickEvent()\n  self.current = ev\n  self:apply(ev.effetti)\n  self:checkEarly()\n  self.startLines = out\n  return ev\nend\n\nfunction Model:available(a) return self:test(a.se) end\n\nfunction Model:act(i)\n  local a = self.d.azioni[i]\n  local out = {}\n  if not a or not self:available(a) then return out end\n  self:apply(a.effetti)\n  if a.scopre and not self.revealed then\n    self.revealed = true\n    self:apply(self.current.se_scopri)\n  end\n  if #a.risposte > 0 then\n    local n = #a.risposte\n    local idx = self.replies[i] or 0\n    local text\n    for _ = 1, n do\n      idx = idx % n + 1\n      local r = a.risposte[idx]\n      if not r:find(\"{opinione}\", 1, true) or self:lastOpinion() then text = self:fill(r); break end\n    end\n    self.replies[i] = idx\n    if text then\n      out[#out + 1] = { (a.chi ~= \"\" and (self:fill(a.chi) .. \": \") or \"\") .. \"«\" .. text .. \"»\", \"bot\" }\n    end\n  end\n  if a.dopo ~= \"\" then out[#out + 1] = { self:fill(a.dopo), \"dim\" } end\n  if a.scopre and self.current.nasconde ~= \"\" and a.dopo == \"\" then\n    out[#out + 1] = { \"Ora sai cosa c'era dietro.\", \"truth\" }\n  end\n  self:runRules(\"fine turno\", out)\n  local now = self.vars\n  for _, o in ipairs(self.opinioni) do\n    if o.stato == \"assente\" and self:test(o.def.nasce) then\n      o.stato = \"attiva\"\n      out[#out + 1] = { \"Nuova opinione: «\" .. self:fill(o.def.testo) .. \"»\", \"op\" }\n    elseif o.stato == \"attiva\" and o.def.cade and self:test(o.def.cade) then\n      o.stato = \"caduta\"\n      out[#out + 1] = { \"Messa in discussione: «\" .. self:fill(o.def.testo) .. \"»\", \"opfall\" }\n    end\n  end\n  self:checkEarly()\n  return out\nend\n\nfunction Model:isOver() return self.early ~= nil or self.turno >= self.d.turni end\n\nfunction Model:ending()\n  if self.early then return self.early end\n  for _, f in ipairs(self.d.finali) do\n    if self:test(f.condizione) then return f end\n  end\n  return self.d.finali[#self.d.finali]\nend\n\nreturn Model\n", "lib/loader.lua": "-- Legge design.lua, traduce gli errori in italiano, completa ciò che manca\n-- e controlla che ogni nome usato negli effetti e nelle condizioni esista.\nlocal expr = require(\"lib.expr\")\n\nlocal L = {}\n\nlocal function num(v, def)\n  v = tonumber(v)\n  if v == nil then return def end\n  return v\nend\nlocal function str(v, def)\n  if v == nil then return def end\n  return tostring(v)\nend\nlocal function list(v) return type(v) == \"table\" and v or {} end\n\nfunction L.read()\n  if love.filesystem.getInfo(\"design_utente.lua\") then\n    return love.filesystem.read(\"design_utente.lua\"), \"design.lua\"\n  end\n  local okio, f = pcall(function() return io and io.open and io.open(\"/design_utente.lua\", \"r\") end)\n  if okio and f then\n    local s = f:read(\"*a\"); f:close()\n    if s and #s > 0 then return s, \"design.lua\" end\n  end\n  return love.filesystem.read(\"design.lua\"), \"design.lua\"\nend\n\nfunction L.italian(err)\n  err = tostring(err)\n  local line, msg = err:match(\":(%d+):%s*(.*)$\")\n  msg = msg or err\n  local function near(m) return m:match(\"near '(.-)'$\") or m:match(\"near (.-)$\") or \"\" end\n  local out\n  local closeLine = msg:match(\"to close '{' at line (%d+)\")\n  if closeLine then\n    out = \"manca una virgola o una } : la { aperta alla riga \" .. closeLine .. \" non si chiude bene (vicino a «\" .. near(msg) .. \"»)\"\n  elseif msg:find(\"unfinished string\", 1, true) then\n    out = \"una frase non ha le virgolette di chiusura \\\"\"\n  elseif msg:find(\"'}' expected\", 1, true) then\n    out = \"manca una virgola prima di «\" .. near(msg) .. \"» (o una } di troppo prima)\"\n  elseif msg:find(\"'=' expected\", 1, true) then\n    out = \"manca un = vicino a «\" .. near(msg) .. \"»\"\n  elseif msg:find(\"unexpected symbol\", 1, true) then\n    out = \"simbolo inatteso vicino a «\" .. near(msg) .. \"»: controllate virgole e virgolette alla riga prima\"\n  elseif msg:find(\"malformed number\", 1, true) then\n    out = \"un numero è scritto male (vicino a «\" .. near(msg) .. \"»)\"\n  elseif msg:find(\"'<eof>' expected\", 1, true) then\n    out = \"c'è qualcosa dopo la } finale del file\"\n  else\n    out = msg\n  end\n  if line then return \"Riga \" .. line .. \": \" .. out end\n  return out\nend\n\nfunction L.parse(src, name)\n  if not src or src == \"\" then return nil, \"Il file design.lua è vuoto.\" end\n  -- Lua 5.1 (LÖVE, love.js) usa loadstring + setfenv; Lua 5.3 (fengari) usa load con ambiente.\n  local chunk, err\n  if setfenv then\n    chunk, err = loadstring(src, \"=\" .. (name or \"design.lua\"))\n    if chunk then setfenv(chunk, {}) end\n  else\n    chunk, err = load(src, \"=\" .. (name or \"design.lua\"), \"t\", {})\n  end\n  if not chunk then return nil, L.italian(err) end\n  local ok, res = pcall(chunk)\n  if not ok then return nil, L.italian(res) end\n  if type(res) ~= \"table\" then return nil, \"Il file deve iniziare con «return {» e finire con «}».\" end\n  return res\nend\n\nlocal FONTI = { social = true, chatbot = true, persona = true, corpo = true, altro = true }\nlocal VISTE = { sempre = true, [\"se scopri\"] = true, mai = true }\nlocal STILI = { barra = true, numero = true, pallini = true }\n\nfunction L.normalize(raw)\n  local w, d = {}, {}\n  local known = { turno = true, turni = true }\n  local function warn(t) if #w < 12 then w[#w + 1] = t end end\n\n  d.titolo = str(raw.titolo, \"Senza titolo\")\n  d.autori = str(raw.autori, \"\")\n  d.messaggio = str(raw.messaggio, \"\")\n  local TEMI = { social = \"Social\", chatbot = \"Chatbot e IA\", male = \"Stare male\", corpo = \"Corpo e salute\", relazioni = \"Relazioni\" }\n  d.tema = str(raw.tema, \"\")\n  d.temaNome = TEMI[d.tema] or \"\"\n  d.presentazione = str(raw.presentazione, \"\")\n  d.protagonista = str(raw.protagonista, \"Ale\")\n  d.turni = math.floor(math.max(1, math.min(40, num(raw.turni, 10))))\n  d.ordine = (str(raw.ordine, \"in fila\") == \"a caso\") and \"a caso\" or \"in fila\"\n\n  -- grandezze\n  d.grandezze = {}\n  for i, g in ipairs(list(raw.grandezze)) do\n    if type(g) == \"table\" then\n      local nome = str(g.nome, \"\"):lower():gsub(\"%s+\", \"_\")\n      if not nome:match(\"^[%a_\\128-\\255][%w_\\128-\\255]*$\") or expr.RISERVATI[nome] or nome == \"nome\" or nome == \"opinione\" or nome == \"turno\" or nome == \"turni\" then\n        warn(\"Grandezza \" .. i .. \": il nome «\" .. str(g.nome, \"\") .. \"» non va bene (lettere, numeri e _; non «e», «o», «turno»)\")\n      elseif known[nome] then\n        warn(\"Grandezza «\" .. nome .. \"» definita due volte\")\n      else\n        known[nome] = true\n        local inizio = num(g.inizio, 0)\n        local mn = num(g.min, inizio < 0 and -100 or 0)\n        local mx = num(g.max, 100)\n        if mx < mn then mn, mx = mx, mn end\n        local vista = str(g.vista, \"sempre\")\n        if not VISTE[vista] then warn(\"Grandezza «\" .. nome .. \"»: vista deve essere \\\"sempre\\\", \\\"se scopri\\\" o \\\"mai\\\"\"); vista = \"sempre\" end\n        local stile = g.stile and str(g.stile, \"\") or nil\n        if stile and not STILI[stile] then warn(\"Grandezza «\" .. nome .. \"»: stile deve essere \\\"barra\\\", \\\"numero\\\" o \\\"pallini\\\"\"); stile = nil end\n        if not stile then stile = (mn >= -100 and mx <= 100) and \"barra\" or \"numero\" end\n        if stile == \"pallini\" and (mx > 9 or mn < 0) then stile = \"barra\" end\n        d.grandezze[#d.grandezze + 1] = {\n          nome = nome, etichetta = str(g.etichetta, (nome:gsub(\"_\", \" \"))), spiega = str(g.spiega, \"\"),\n          inizio = math.max(mn, math.min(mx, inizio)), min = mn, max = mx, vista = vista, stile = stile,\n        }\n      end\n    end\n  end\n\n  local used = {}\n  local function cond(text, where)\n    local c, e = expr.condition(text)\n    if not c then warn(where .. \": \" .. e); return { never = true, names = {} } end\n    for _, n in ipairs(c.names) do used[n] = used[n] or where end\n    return c\n  end\n  local function eff(text, where)\n    local c, e = expr.effects(text)\n    if not c then warn(where .. \": \" .. e); return { list = {}, names = {}, targets = {} } end\n    for _, n in ipairs(c.names) do used[n] = used[n] or where end\n    for _, n in ipairs(c.targets) do used[n] = used[n] or where end\n    return c\n  end\n\n  -- azioni\n  d.azioni = {}\n  for i, a in ipairs(list(raw.azioni)) do\n    if type(a) == \"table\" then\n      local where = \"Azione «\" .. str(a.nome, tostring(i)) .. \"»\"\n      local risposte = {}\n      for _, r in ipairs(list(a.risposte)) do risposte[#risposte + 1] = tostring(r) end\n      d.azioni[#d.azioni + 1] = {\n        nome = str(a.nome, \"Azione \" .. i), chi = str(a.chi, \"\"), dopo = str(a.dopo, \"\"),\n        effetti = eff(a.effetti, where), se = cond(a.se, where .. \" (se)\"),\n        scopre = a.scopre == true or a.scopre == \"sì\" or a.scopre == \"si\", risposte = risposte,\n      }\n    end\n  end\n  if #d.azioni == 0 then return nil, \"Non c'è nessuna azione: aggiungete almeno un'azione nella sezione «azioni».\" end\n  if #d.azioni > 6 then warn(\"Ci sono \" .. #d.azioni .. \" azioni: il gioco ne mostra solo 6\") end\n\n  -- regole\n  d.regole = {}\n  for i, r in ipairs(list(raw.regole)) do\n    if type(r) == \"table\" then\n      local where = \"Regola «\" .. str(r.nome, tostring(i)) .. \"»\"\n      local q = str(r.quando, \"fine turno\")\n      if q ~= \"inizio turno\" and q ~= \"fine turno\" then warn(where .. \": quando deve essere \\\"inizio turno\\\" o \\\"fine turno\\\"\"); q = \"fine turno\" end\n      d.regole[#d.regole + 1] = {\n        nome = str(r.nome, \"Regola \" .. i), quando = q, testo = str(r.testo, \"\"),\n        se = cond(r.se, where .. \" (se)\"), allora = eff(r.allora, where),\n      }\n    end\n  end\n\n  -- eventi\n  d.eventi = {}\n  for i, e in ipairs(list(raw.eventi)) do\n    if type(e) == \"table\" then\n      local f = str(e.fonte, \"persona\")\n      if f == \"feed\" then f = \"social\" end\n      if not FONTI[f] then warn(\"Evento \" .. i .. \": la fonte «\" .. f .. \"» non esiste, uso «altro»\"); f = \"altro\" end\n      local where = \"Evento \" .. i\n      d.eventi[#d.eventi + 1] = {\n        fonte = f, chi = str(e.chi, \"\"), mostra = str(e.mostra, \"...\"), nasconde = str(e.nasconde, \"\"),\n        effetti = eff(e.effetti, where), se_scopri = eff(e.se_scopri, where .. \" (se scopri)\"), se = cond(e.se, where .. \" (se)\"),\n      }\n    end\n  end\n  if #d.eventi == 0 then return nil, \"Non c'è nessun evento: aggiungete almeno un evento nella sezione «eventi».\" end\n\n  -- opinioni\n  d.opinioni = {}\n  for i, o in ipairs(list(raw.opinioni)) do\n    if type(o) == \"table\" then\n      local where = \"Opinione \" .. i\n      d.opinioni[#d.opinioni + 1] = {\n        testo = str(o.testo, \"...\"), nasce = cond(o.nasce_se or \"turno < 0\", where .. \" (nasce se)\"),\n        cade = (o.cade_se and o.cade_se ~= \"\") and cond(o.cade_se, where .. \" (cade se)\") or nil,\n      }\n    end\n  end\n\n  -- finali\n  d.finali = {}\n  for i, f in ipairs(list(raw.finali)) do\n    if type(f) == \"table\" then\n      d.finali[#d.finali + 1] = {\n        titolo = str(f.titolo, \"Fine\"), testo = str(f.testo, \"\"),\n        condizione = cond(f.se, \"Finale \" .. i), subito = f.subito == true and f.se ~= nil and f.se ~= \"\",\n      }\n    end\n  end\n  if #d.finali == 0 then d.finali = { { titolo = \"Fine\", testo = \"\", condizione = { always = true } } } end\n\n  -- confronta = { \"emozione\", \"vissuto\" }: una linea mostra la distanza tra due grandezze\n  if type(raw.confronta) == \"table\" and raw.confronta[1] and raw.confronta[2] then\n    local a, b = str(raw.confronta[1], \"\"):lower(), str(raw.confronta[2], \"\"):lower()\n    if known[a] and known[b] then d.confronta = { a, b, se = cond(raw.confronta.se, \"confronta (se)\") }\n    else warn(\"confronta: «\" .. a .. \"» o «\" .. b .. \"» non è una grandezza\") end\n  end\n\n  -- nomi usati ma mai definiti: il gioco li crea a 0 e avvisa\n  local missing = {}\n  for n, where in pairs(used) do\n    if not known[n] then missing[#missing + 1] = n end\n  end\n  table.sort(missing)\n  for _, n in ipairs(missing) do\n    warn(used[n] .. \": la grandezza «\" .. n .. \"» non esiste (la creo a 0, nascosta)\")\n    d.grandezze[#d.grandezze + 1] = { nome = n, etichetta = n, spiega = \"\", inizio = 0, vista = \"mai\", stile = \"numero\" }\n  end\n  return d, w\nend\n\nfunction L.load()\n  local src, name = L.read()\n  local raw, err = L.parse(src, name)\n  if not raw then return nil, err end\n  local d, w = L.normalize(raw)\n  if not d then return nil, w end\n  return d, w\nend\n\nreturn L\n"};
  // Il motore LÖVE (love.js 11.4.1, modalità compatibile) arriva dal CDN pubblico di npm.
